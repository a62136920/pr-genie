name: PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate PR summary
        uses: ./
        with:
          mode: pr-summary
          api-key: ${{ secrets.OPENAI_API_KEY }}
          # DeepSeek example:
          # api-base: https://api.deepseek.com/v1
          # model: deepseek-chat
          language: zh
